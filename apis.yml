aid: pacific-fusion
name: Pacific Fusion
description: >-
  Pacific Fusion is a fusion energy company based in Fremont, California
  developing commercial fusion power using pulsed magnetic inertial fusion.
  Its modular system pairs a fast electric pulser, a meter-scale fusion
  chamber, and centimeter-scale fuel targets to pursue net facility gain with
  practical, affordable manufacturing. Building on breakthroughs from US
  National Laboratories (Lawrence Livermore, Sandia) and partners such as
  General Atomics, the company aims to deliver limitless, clean, on-demand
  power. Surfaced as a portfolio company of DCVC, General Catalyst, and
  Lightspeed Venture Partners, this profile has been enriched through the
  API Evangelist network. Pacific Fusion is a hardware and energy company and
  publishes no public API, developer portal, or SDK surface at this time.
